# Perfil de Desenvolvimento Local (PostgreSQL)

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_DEV_URL:jdbc:postgresql://localhost:5432/inspection_db}
spring.datasource.username=${SPRING_DATASOURCE_DEV_USERNAME:julie}
spring.datasource.password=${SPRING_DATASOURCE_DEV_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Azure Blob Storage Configuration
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:inspections}
